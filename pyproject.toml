[project]
name = "credit-risk-mlops"
version = "0.1.0"
description = "Ciclo de vida completo de um modelo de risco de crédito, do dado bruto ao monitoramento."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=3.1.0",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # pep8-naming
    "PL",       # pylint
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
"notebooks/**" = ["E501", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=credit_risk --cov-report=term-missing --cov-fail-under=80"
markers = [
    "data: testes de schema e distribuição dos dados",
    "model: testes de comportamento do modelo",
]
